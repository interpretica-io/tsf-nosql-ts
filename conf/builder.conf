# The engine and the agent are built for the same platform: the agent runs
# on the engine host. tapi_nosql reaches each database through the
# agent's RPC server, so this suite has a real agent with an RPC server,
# and the database client libraries live in that server, not in the
# tests.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

# The external library under test. Its reference lives in
# conf/external.yml and the commit actually built in
# conf/builder.conf.lock. ta_nosql and rpcs_nosql go onto the agent
# (listed again in the RPC server application below), tapi_nosql onto
# the engine.
TE_EXT_REPO_USE([tsf_nosql], [], [ta_nosql rpcs_nosql tapi_nosql])

# The nosql_* RPCs. The platform is shared by engine and agent, so one
# declaration wires rpcxdr (engine) and rpcxdrta (agent) both.
TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4,../ta_nosql/nosql_rpc.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# The traffic engine restricted to the protocols needed; without this the
# meson build pulls the full default set, which includes SNMP and is
# unsupported under meson.
TE_LIB_PARMS([tapi_tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])
TE_LIB_PARMS([tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# One Test Agent of the stock unix flavour.
TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# The client libraries ta_nosql links, by pkg-config name: whichever of
# hiredis (+ hiredis_ssl), libmongoc, the DataStax C driver
# ("cassandra"), libmemcached and libcurl the build host has. Every
# driver is optional; ta_nosql is built with the ones found. jansson is
# required.
TS_NOSQL_DEPS="libpcre2-8 jansson"
for ts_nosql_dep in hiredis hiredis_ssl libmongoc-1.0 cassandra \
                    libmemcached libcurl ; do
    if pkg-config --exists "${ts_nosql_dep}" ; then
        TS_NOSQL_DEPS="${TS_NOSQL_DEPS} ${ts_nosql_dep}"
    fi
done

# The RPC server application. tapi_nosql's RPCs run here, so it links
# the agent-side ta_nosql (the connections and the drivers) and
# rpcs_nosql (the nosql_* RPCs) on top of the stock RPC server. A test
# of an engine whose driver is not linked in skips.
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [ta_nosql rpcs_nosql \
           conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh --extra-deps='${TS_NOSQL_DEPS}'],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
